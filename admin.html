<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planet Pizza — Administration</title><link rel="stylesheet" href="style.css"><style>
.admin{max-width:1250px;margin:auto;padding:28px 20px 80px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{background:#141a24;color:#fff;border:1px solid #ffffff22;padding:10px 14px;border-radius:9px;cursor:pointer}.tab.active{border-color:#54d2d2}.panel{background:#141a24;border:1px solid rgba(84,210,210,.18);border-radius:16px;padding:20px;margin-top:16px}.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}.cards{display:grid;gap:12px}.card{border:1px solid #ffffff14;border-radius:12px;padding:15px;background:#0f141d}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.badge{padding:4px 8px;border-radius:999px;font-size:.78rem}.on{background:#2ecc7130;color:#2ecc71}.off{background:#e74c3c30;color:#e74c3c}.low{background:#f39c1230;color:#f39c12}.field{display:grid;gap:5px;margin:10px 0}.field input,.field select,.field textarea{background:#0b0e14;color:#fff;border:1px solid #ffffff22;border-radius:8px;padding:9px;width:100%;box-sizing:border-box}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:.84rem}.muted{color:#a0aec0}.size-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ingredient-list{max-height:420px;overflow:auto}.recipe-line{display:grid;grid-template-columns:1fr 100px 70px;gap:8px;align-items:center;margin:6px 0}.hidden{display:none}@media(max-width:850px){.grid{grid-template-columns:1fr}.size-grid{grid-template-columns:1fr}.recipe-line{grid-template-columns:1fr 80px 60px}}
</style></head>
<body><header><div class="container nav-wrapper"><div class="logo-box"><img src="logo.jpg" class="logo-img" alt="Planet Pizza"><div class="logo-title">Planet Pizza</div></div><nav class="main-nav"><a href="index.html">Site</a><a href="menu.html">Carte</a><a href="admin.html" aria-current="page">Administration</a></nav></div></header>
<main class="admin"><div class="row"><div><h1>Gestionnaire restaurant</h1><p class="muted">Catalogue, tailles, recettes et disponibilité.</p></div><span id="connection" class="badge off">API non connectée</span></div>
<div class="tabs"><button class="tab active" data-tab="catalogue">🍕 Catalogue</button><button class="tab" data-tab="ingredients">🧀 Ingrédients & stock</button><button class="tab" data-tab="orders">📦 Commandes</button></div>
<section id="tab-catalogue" class="panel"><div class="toolbar"><button class="btn-primary" id="newProduct">+ Nouvelle pizza</button><input id="search" placeholder="Rechercher une pizza…" style="flex:1;min-width:220px;background:#0b0e14;color:#fff;border:1px solid #ffffff22;border-radius:8px;padding:10px"></div><div class="grid"><div><div id="products" class="cards"></div></div><div id="editor" class="card"><h2>Éditeur</h2><p class="muted">Sélectionne une pizza pour modifier son nom, sa description, ses prix, ses tailles et sa disponibilité.</p></div></div></section>
<section id="tab-ingredients" class="panel hidden"><div class="toolbar"><button class="btn-primary" id="newIngredient">+ Nouvel ingrédient</button></div><div id="ingredients" class="ingredient-list cards"></div></section>
<section id="tab-orders" class="panel hidden"><div id="orders"></div></section>
</main><script src="admin.js" defer></script></body></html>
