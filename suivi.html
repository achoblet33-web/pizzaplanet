<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Suivre ma commande — Planet Pizza</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .tracking-shell{max-width:820px;margin:auto;padding:38px 20px 80px}.tracking-card{background:#141a24;border:1px solid rgba(84,210,210,.28);border-radius:18px;padding:24px}.track-form{display:flex;gap:10px;max-width:520px;margin:18px auto}.track-form input{flex:1;min-width:0;text-transform:uppercase;letter-spacing:.18em;text-align:center;font-size:1.15rem;background:#0b0e14;color:#fff;border:1px solid #ffffff25;border-radius:10px;padding:12px}.track-code{font-family:Orbitron,sans-serif;font-size:2rem;letter-spacing:.18em;color:#54d2d2}.track-status{font-size:1.3rem;font-weight:800;margin:10px 0}.eta{font-size:2rem;font-family:Orbitron,sans-serif;margin:14px 0;color:#ffb45c}.timeline{display:grid;gap:10px;margin-top:24px}.step{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:12px;border-radius:12px;background:#0b0e14;border:1px solid #ffffff10}.step-dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#ffffff12}.step.done{border-color:#2ecc7155}.step.done .step-dot{background:#2ecc71;color:#08110c}.step.current{border-color:#54d2d2}.step.current .step-dot{background:#54d2d2;color:#0b0e14}.muted{color:#a0aec0}.hidden{display:none}@media(max-width:600px){.track-form{flex-direction:column}}
  </style>
</head>
<body>
<header><div class="container nav-wrapper"><div class="logo-box"><img src="logo.jpg" class="logo-img" alt="Planet Pizza"><div class="logo-title">Planet Pizza</div></div><nav class="main-nav"><a href="index.html">Accueil</a><a href="menu.html">La Carte</a><a href="customer.html">Commander</a></nav></div></header>
<main class="tracking-shell">
  <section class="tracking-card">
    <div style="text-align:center"><h1>Suivre ma commande</h1><p class="muted">Saisissez le code de 4 caractères affiché après votre paiement.</p></div>
    <form id="trackForm" class="track-form"><input id="trackCode" maxlength="4" autocomplete="off" placeholder="K7QF" aria-label="Code de commande"><button class="btn-primary" type="submit">Suivre</button></form>
    <div id="trackError" class="hidden" style="text-align:center;color:#ff7a7a"></div>
    <div id="trackingResult" class="hidden">
      <div style="text-align:center"><div class="muted">Commande</div><div id="resultCode" class="track-code"></div><div id="resultStatus" class="track-status"></div><div class="muted">Temps restant estimé</div><div id="resultEta" class="eta"></div><div id="resultRefresh" class="muted small"></div></div>
      <div id="timeline" class="timeline"></div>
    </div>
  </section>
</main>
<script src="tracking.js" defer></script>
</body>
</html>
